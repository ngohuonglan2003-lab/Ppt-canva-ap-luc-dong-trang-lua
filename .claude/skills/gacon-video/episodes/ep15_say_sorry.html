// Tập 15 · Little Chick Learns to Say Sorry — chỉ tiếng Anh
const EP={SHIFT:26,INTRO:4,MAIN:37,END:34.2};
EP.LANG={en:{caps:[[1.2,3.2,'Splash! Oh no!'],[3.4,6.6,"Froggy's picture is wet."],[7.0,10.2,'Little Chick feels bad.'],[10.6,13.8,"I'm sorry, Froggy!"],[14.2,17.4,'Let me help you.'],[17.8,21.4,"Let's draw a new picture together!"],[21.8,25.4,'Wow! It is so pretty!'],[25.8,29.4,'Thank you, Little Chick!'],[29.8,33.6,'Saying sorry makes it better! Bye-bye!']],
 name:'Little Chick',sub:'See you next time!',ep:'Saying Sorry'}};
EP.SHOTS=[[0,3.4,1.5,100,250,1.6,100,250],[3.4,7.0,1.7,132,262,1.85,132,262],[7.0,10.6,1.7,56,230,1.85,56,228],[10.6,17.8,1.15,94,250,1.2,94,250],[17.8,25.8,1.5,104,250,1.65,104,248],[25.8,29.8,1.6,134,265,1.75,134,265],[29.8,99,1.15,94,250,1.25,94,250]];
const FSP=[[25.8,29.4]];
EP.main=function(t){
  let w=meadow(t);
  const mv=window.ENV?mouthAt(t+INTRO):0, fSp=FSP.some(([a,b])=>t>a&&t<b);
  const wet=t<0.9?0:eOut(clamp((t-0.9)/0.5)); const draw=t<17.8?0:clamp((t-18)/3.2);
  w+=easel(102,292,t<17.8?wet:0,draw);
  // cốc nước đổ
  if(t<17.8){const tip=eOut(prog(t,0.4,0.9)); w+=`<g transform="translate(86 286) rotate(${tip*80})"><rect x="-4" y="-10" width="8" height="11" rx="1.5" fill="#BFE7FA" stroke="#7CC8F0"/></g>`;
    if(t>0.7&&t<1.4){const u=(t-0.7)/0.7; for(let k=0;k<6;k++)w+=`<circle cx="${88+u*18+k*2}" cy="${282-20*Math.sin(Math.PI*u)+k}" r="1.6" fill="#7CC8F0"/>`;}}
  // giấy mới & bút sáp
  if(t>14.2&&t<17.8){const u=eBack(prog(t,14.2,14.7)); w+=`<g transform="translate(70 ${300-u*8}) scale(${u})"><rect x="-10" y="-7" width="20" height="14" fill="#fff" stroke="#E0D5C0"/><rect x="12" y="-6" width="3" height="10" rx="1" fill="#F2545B"/><rect x="16" y="-6" width="3" height="10" rx="1" fill="#45B6F0"/></g>`;}
  let ge='happy', gwl=0, gwr=0, gj=0, frogB=false, fy=292;
  if(t<1.0)ge='open'; if(t>1.0&&t<3.4)ge='wow';
  if(t>3.4&&t<10.6)ge='sad';
  if(t>10.6&&t<14.2){ge='sad'; gwl=-30; gwr=30;}
  if(t>14.2&&t<17.8){ge='happy'; gwr=-60;}
  if(t>17.8&&t<21.8){gwr=-60+20*Math.sin(t*10);}
  if(t>21.8&&t<25.8){gj=6*Math.abs(Math.sin(t*Math.PI*1.4)); gwl=100; gwr=-100;}
  if(t>29.8){gwr=waveWR(t,29.8); gj=3*Math.abs(Math.sin(t*5));}
  w+=selChick(56,238,.54,{jump:gj,wl:gwl,wr:gwr,eyes:ge,mouth:fSp?0:mv},t);
  const frogSad=t>1.2&&t<14.2;
  if(t>21.8&&t<25.8)fy=292-6*Math.abs(Math.sin(t*Math.PI*1.4));
  w+=frog(136,fy,{puff:fSp?mv:0,blink:frogSad?((t%1.2)>0.6):((t%3)>2.85),jumpK:0});
  if(frogSad)w+=fxTears(136,284,t);
  if(t>7&&t<10.6)w+=`<path d="M80 214 q-2 3 0 5 q2 -2 0 -5 Z" fill="#9ED8F5"/>`;
  w+=fxHearts(96,226,t,25.8)+wind(t);
  return `<g transform="${cam(t)}">${w}</g>`+bigWord("I'M SORRY!",t,10.6,13.6,118,'#45B6F0',30)+confetti(t,21.8,3.6);
};
